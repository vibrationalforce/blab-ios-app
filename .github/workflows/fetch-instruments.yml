# =============================================================================
# ECHOELMUSIC — FETCH INSTRUMENTS (one-shot asset acquisition)
# =============================================================================
# Downloads the GeneralUser GS soundfont (free license, redistribution allowed)
# and commits it into Sources/Echoelmusic/Resources/Instruments/ so builds are
# hermetic (no download at build time). Created 2026-07-04 with explicit
# founder approval ("echte Instrumente ... Beschaffung über CI: Ja, bauen").
#
# Trigger: push that touches .deploy/fetch-instruments (the sandbox that
# authors code has no direct download access — this runner does).
# Idempotent: exits early if the asset already exists at a sane size.
# =============================================================================

name: "Fetch Instruments"

on:
  push:
    paths:
      - '.deploy/fetch-instruments'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Skip if asset already present
        id: check
        run: |
          F="Sources/Echoelmusic/Resources/Instruments/GeneralUserGS.sf2"
          if [ -f "$F" ] && [ "$(stat -c%s "$F")" -gt 20000000 ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Asset already present ($(stat -c%s "$F") bytes) — nothing to do."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download GeneralUser GS
        if: steps.check.outputs.present == 'false'
        run: |
          set -e
          mkdir -p /tmp/sf
          # Candidate URLs (upstream file naming has varied across releases).
          URLS=(
            "https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser-GS.sf2"
            "https://github.com/mrbumpy409/GeneralUser-GS/raw/master/GeneralUser-GS.sf2"
            "https://github.com/mrbumpy409/GeneralUser-GS/raw/main/GeneralUser%20GS.sf2"
          )
          for u in "${URLS[@]}"; do
            echo "Trying: $u"
            if curl -fL --retry 3 -o /tmp/sf/GeneralUserGS.sf2 "$u"; then
              break
            fi
          done
          SIZE=$(stat -c%s /tmp/sf/GeneralUserGS.sf2 2>/dev/null || echo 0)
          echo "Downloaded size: $SIZE bytes"
          # Sanity: a real SF2 bank is >20 MB and starts with a RIFF header.
          test "$SIZE" -gt 20000000
          head -c 4 /tmp/sf/GeneralUserGS.sf2 | grep -q "RIFF"
          # License text (required for redistribution attribution).
          curl -fL --retry 3 -o /tmp/sf/LICENSE.txt \
            "https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/documentation/LICENSE.txt" \
            || curl -fL --retry 3 -o /tmp/sf/LICENSE.txt \
            "https://raw.githubusercontent.com/mrbumpy409/GeneralUser-GS/main/LICENSE.txt" \
            || echo "GeneralUser GS by S. Christian Collins — see https://github.com/mrbumpy409/GeneralUser-GS for license (free to use and redistribute)." > /tmp/sf/LICENSE.txt

      - name: Commit asset
        if: steps.check.outputs.present == 'false'
        run: |
          set -e
          DEST="Sources/Echoelmusic/Resources/Instruments"
          mkdir -p "$DEST"
          cp /tmp/sf/GeneralUserGS.sf2 "$DEST/GeneralUserGS.sf2"
          cp /tmp/sf/LICENSE.txt "$DEST/LICENSE-GeneralUserGS.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$DEST"
          git commit -m "chore(assets): GeneralUser GS soundfont — real-instrument bank (free license)"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Summary
        run: |
          F="Sources/Echoelmusic/Resources/Instruments/GeneralUserGS.sf2"
          echo "## Fetch Instruments" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$F" ]; then
            echo "Asset in repo: $(stat -c%s "$F") bytes" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Asset NOT present — check download step." >> "$GITHUB_STEP_SUMMARY"
          fi
