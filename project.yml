# =============================================================================
# ECHOELMUSIC - XCODEGEN PROJECT CONFIGURATION
# =============================================================================
# Echoelmusic — bio-reactive performance instrument (iPhone, iOS 18)
# =============================================================================

name: Echoelmusic

options:
  bundleIdPrefix: com.echoelmusic
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Release

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_NAME: $(TARGET_NAME)
    # Fallback only — every TestFlight run seds this to the version in
    # .deploy/release (testflight.yml "DEPLOY_VER"), so bump it when it drifts
    # far behind; a manual/local archive would otherwise ship the stale number.
    MARKETING_VERSION: "10.79.349"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER:=1}"
    ENABLE_BITCODE: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GCC_OPTIMIZATION_LEVEL: "s"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APP_ICON_ASSETS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
      DEBUG_INFORMATION_FORMAT: "dwarf"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-function-bodies=200 -Xfrontend -warn-long-expression-type-checking=200"
      # Required for `@testable import Echoelmusic` from the unit-test bundles: without
      # testability the app emits no testable .swiftmodule, so under Xcode 26's explicit
      # modules the test target's import is unsatisfiable → "Unable to find module
      # dependency: 'Echoelmusic'" (the SOLE error the reveal-first full-tests run hit —
      # NOT 294 broken files, a single wiring gap). Debug-only; Release stays untestable.
      ENABLE_TESTABILITY: YES
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      SWIFT_COMPILATION_MODE: "wholemodule"

# =============================================================================
# TARGETS
# =============================================================================

targets:

  # ===========================================================================
  # iOS App — Echoelmusic (bio-reactive performance instrument)
  # ===========================================================================
  Echoelmusic:
    type: application
    platform: iOS
    sources:
      - path: Sources/Echoelmusic
        type: group
        excludes:
          - "**/*.md"
          # Drums/Samples/Community are declared ONLY via the explicit
          # `resources: type: folder` entries below (they need the real
          # subdirectory structure preserved for `subdirectory:`-based bundle
          # lookups). Without these excludes the generic group walk ALSO
          # registers every file under them individually (flattened), so each
          # file was double-declared — resources: type: folder + Community's
          # own explicit entry (added to fix CommunityLibraryTests/
          # MoodPresetTests, project.yml commit 95f0602) did not actually
          # resolve the CI failures, because the flattened duplicate from this
          # group walk was what the build kept. Excluding them here removes
          # the ambiguity at its root instead of guessing at Xcode's
          # duplicate-resolution order.
          - "Resources/Drums/**"
          - "Resources/Samples/**"
          - "Resources/Community/**"
    resources:
      - path: Sources/Echoelmusic/Resources/Assets.xcassets
      # (Removed 2026-07-07: the GeneralUser GS soundfont bundle entry — the
      # sampled-instrument voice is gone entirely, founder "Real Instruments
      # komplett raus", so the 31 MB .sf2 no longer ships.)
      # Drum + sample WAVs — folder references preserve the Drums/ · Samples/
      # subdirectories BeatPlayer looks them up by (subdirectory:"Drums") and
      # avoid filename collisions between the two libraries.
      - path: Sources/Echoelmusic/Resources/Drums
        type: folder
      - path: Sources/Echoelmusic/Resources/Samples
        type: folder
      # Community JSON (fx/moods/patches) — same folder-reference need as Drums/
      # Samples above: CommunityLibrary.load(_:as:) looks these up by
      # `subdirectory:"Community/fx"` etc. The generic `sources:` group entry for
      # Sources/Echoelmusic flattens non-source files to the bundle root, which
      # made the subdirectory lookup return nil (CommunityLibraryTests/
      # MoodPresetTests failing in CI — the app never actually lost these files,
      # the test target just couldn't find them at the expected path).
      - path: Sources/Echoelmusic/Resources/Community
        type: folder
      - path: Resources/PrivacyInfo.xcprivacy
        type: file
      # Brand font Atkinson Hyperlegible (mirrors echoelmusic.com). The .ttf files
      # are converted from the website's .woff2; registered via UIAppFonts below.
      - path: Resources/Fonts
        type: group
    # NOTE: No `info:` block here on purpose. A generated `info.properties` block
    # WRITES Resources/iOS/Info.plist at `xcodegen generate` time, clobbering the
    # hand-maintained, complete, truthful committed plist — the old block silently
    # DROPPED NSLocationWhenInUseUsageDescription (→ ITMS-90683 rejection + killed the
    # "Place in session name" feature) and shipped a FALSE NSHealthUpdate claim while
    # HealthKitWriter actually writes HR+respiratory. The committed Resources/iOS/Info.plist
    # is the single source of truth, referenced via INFOPLIST_FILE + GENERATE_INFOPLIST_FILE: NO.
    # Guarded by scripts/check-infoplist.sh in xcode-compile-check.yml. Do NOT re-add `info:`.
    settings:
      base:
        PRODUCT_NAME: Echoelmusic
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.app
        INFOPLIST_FILE: Resources/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Echoelmusic.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APP_ICON_ASSETS: YES
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
    dependencies:
      # Widget extension — compile-verified green (compile_check run on 7c2af59:
      # EchoelmusicWidgets builds for iOS). Embedded so the app bundles the
      # widget. Compile of the embedded build is checked no-signing via
      # compile_check; signing/provisioning of com.echoelmusic.app.widgets is
      # verified by the next full archive (build_only=false).
      - target: EchoelmusicWidgets
      # watchOS companion — embed BLOCKED (C6b). Even WITH
      # WKCompanionAppBundleIdentifier=com.echoelmusic.app in the watch
      # Info.plist, the archive still exports with ZERO valid distribution
      # methods ("Unknown Distribution Error" / "expected one {}"). Root cause is
      # the generated "Embed Watch Content" phase under XcodeGen+Xcode26, which
      # cannot be inspected/fixed from the Linux sandbox (no local Xcode). Kept
      # dependency-OFF so the app+widget archive uploads cleanly (build 1454
      # path). Companion key retained for when the embed phase is solved.
      # NEXT: open the generated .xcodeproj in Xcode, verify the watch app lands
      # in the "Watch" folder via an Embed-Watch-Content phase (not PlugIns/
      # Frameworks); or try XcodeGen dependency `embed: true`/`copy` overrides.
      # - target: EchoelmusicWatch   # re-enable once the embed phase is correct
      # AUv3 REMOVED 2026-07-24 (founder verdict: Echoelmusic = pure instrument, no
      # AUv3). The EchoelmusicAUv3 app-extension target + its embed are gone; the app
      # no longer ships its own AU plugin. (DSP/ stays Foundation-only by hygiene even
      # though the isolated-AUv3-compile that mandated it is retired.)
    entitlements:
      path: Echoelmusic.entitlements

  # ===========================================================================
  # EchoelmusicWidgets — WidgetKit Extension (glanceable live vitals)
  # ===========================================================================
  # SHIPPED (cycle C3 done): the widget IS embedded — the Echoelmusic target
  # lists `- target: EchoelmusicWidgets` above, com.echoelmusic.app.widgets is
  # provisioned by the archive (build 1543+ ships app + widget). The
  # isolated EchoelmusicWidgets scheme below remains for CI compile checks.
  # (This block previously still described the pre-C3 "dependency OFF" state —
  # corrected 2026-07-04, build-setup hygiene pass.)
  EchoelmusicWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/EchoelmusicWidgets
        type: group
        excludes:
          - "**/*.md"
      # Foundation-only App-Group bridge for live vitals (shared with the app).
      # Compiled into the widget module — no app-framework import.
      - path: Sources/Echoelmusic/Core/BioFeedbackManager.swift
    resources:
      # Privacy manifest: the widget reads App-Group UserDefaults (required-reason
      # API) — bundle the shared manifest (App Store audit 2026-07-16).
      - path: Resources/PrivacyInfo.xcprivacy
        type: file
    info:
      path: Resources/EchoelmusicWidgets/Info.plist
      properties:
        CFBundleDisplayName: Echoel Bio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: EchoelmusicWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.app.widgets
        INFOPLIST_FILE: Resources/EchoelmusicWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # Explicit SDKROOT/SUPPORTED_PLATFORMS — XcodeGen's `platform:` alone
        # does not set these here, so without them the target defaults to macOS
        # (matches the main Echoelmusic target's pattern).
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies: []

  # ===========================================================================
  # EchoelmusicWatch — watchOS companion (glance + future on-wrist HR source)
  # ===========================================================================
  # Cycle C5 (scaffold). Dependency OFF the iOS app (not embedded yet) so the
  # app archive cannot build/sign it — signing-safe pattern. Compile-verify in
  # isolation via the EchoelmusicWatch scheme. TO SHIP (C6): confirm
  # com.echoelmusic.app.watchkitapp provisioning, then embed as a dependency of
  # the Echoelmusic target. C7 adds HealthKit on-wrist HR → App Group.
  # HARD CONSTRAINT: Watch HR ~4–5 s latency → display/trend only, NO beat-sync.
  EchoelmusicWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/EchoelmusicWatch
        type: group
        excludes:
          - "**/*.md"
      # Foundation-only App-Group bridge (shared with app + Widgets).
      - path: Sources/Echoelmusic/Core/BioFeedbackManager.swift
    info:
      path: Resources/EchoelmusicWatch/Info.plist
      properties:
        CFBundleDisplayName: Echoel
        WKApplication: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # C6b regression guard (App Store audit 2026-07-16): this `info:` block
        # REGENERATES the committed plist on every `xcodegen generate`, so the
        # companion key MUST live here too — its absence once produced an archive
        # with zero valid distribution methods. Keep in sync with the committed
        # Resources/EchoelmusicWatch/Info.plist.
        WKCompanionAppBundleIdentifier: com.echoelmusic.app
    entitlements:
      path: EchoelmusicWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.app.watchkitapp
        INFOPLIST_FILE: Resources/EchoelmusicWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        # Explicit SDKROOT/SUPPORTED_PLATFORMS — without these XcodeGen's
        # `platform: watchOS` still leaves the target defaulting to macOS.
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies: []

  # ===========================================================================
  # EchoelmusicTests — unit-test bundle (heals the "294 tests ran in NO CI"
  # ultra-audit finding, 2026-07-20). WALKING SKELETON: sources point at a tiny
  # smoke test first to prove the plumbing (xcodegen target syntax + iOS-sim
  # test run + `@testable import` module linking) in isolation from whether all
  # 294 real files compile. SLICE 2 repoints `sources` at Tests/EchoelmusicTests.
  # Hosted by the app (dependency below) → XcodeGen wires TEST_HOST automatically.
  # ===========================================================================
  EchoelmusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/CISmoke
    dependencies:
      - target: Echoelmusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.app.tests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # Xcode 26 explicit-modules workaround: `@testable import` of an APPLICATION
        # target (not a framework) can still fail the module-dependency scan even with
        # testability on. Disabling explicit modules for the test bundle only restores
        # the reliable implicit-module resolution of the host app's testable swiftmodule.
        SWIFT_ENABLE_EXPLICIT_MODULES: NO

  # ===========================================================================
  # EchoelmusicFullTests — the REAL 294-file suite (Task #78 slice 2, REVEAL-FIRST).
  # Same proven bundle.unit-test shape as EchoelmusicTests, but sources point at
  # Tests/EchoelmusicTests. Run ONLY by the dedicated `EchoelmusicFullTests` scheme
  # via the NON-BLOCKING full-tests.yml workflow — so the true pass/fail state of
  # the 294 (never compiled on the iOS-sim test target before) becomes visible
  # WITHOUT reddening the main gates. Once green, the main Echoelmusic scheme flips
  # from the smoke target to this one and the smoke target retires.
  # ===========================================================================
  EchoelmusicFullTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/EchoelmusicTests
    dependencies:
      - target: Echoelmusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.app.fulltests
        GENERATE_INFOPLIST_FILE: YES
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # Same Xcode 26 explicit-modules workaround as EchoelmusicTests (see above):
        # `@testable import` of the app target needs implicit-module resolution here.
        SWIFT_ENABLE_EXPLICIT_MODULES: NO
        # Hosted-xctest Swift symbol resolution: the 294-file suite references app
        # property descriptors / nominal type descriptors / key paths (e.g.
        # `l_keypath` on Scale) that ld does not resolve from the host binary at
        # link even with TEST_HOST/BUNDLE_LOADER set. Defer those to runtime — the
        # bundle is injected into the host app, which exports the (public) symbols.
        # Scoped to this REVEAL-ONLY test target; never in a shipped product.
        OTHER_LDFLAGS: "$(inherited) -Xlinker -undefined -Xlinker dynamic_lookup"

# =============================================================================
# SCHEMES
# =============================================================================

schemes:
  Echoelmusic:
    build:
      targets:
        Echoelmusic: all
    run:
      config: Debug
    test:
      config: Debug
      # Heals the false-green test gate: the existing ci.yml `test-without-building
      # -scheme Echoelmusic` step now actually runs a test target (was empty → 0
      # tests). Smoke target today; the 294-file suite once its compile is verified.
      targets:
        - EchoelmusicTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Task #78 slice 2: dedicated scheme that BUILDS + TESTS the real 294-file suite.
  # Run only by the non-blocking full-tests.yml — reveals the suite's true state
  # without gating, until it is green and the main scheme adopts it.
  EchoelmusicFullTests:
    build:
      targets:
        EchoelmusicFullTests: all
    test:
      config: Debug
      targets:
        - EchoelmusicFullTests

  # Isolated compile-verification scheme for the Widget extension (cycle C2).
  # Lets CI `build_only` prove the widget compiles WITHOUT embedding it in the
  # app archive, so the green TestFlight pipeline is never bet on a blind embed.
  EchoelmusicWidgets:
    build:
      targets:
        EchoelmusicWidgets: all
    run:
      config: Debug
    analyze:
      config: Debug

  # Isolated compile-verification scheme for the watchOS companion (cycle C5).
  EchoelmusicWatch:
    build:
      targets:
        EchoelmusicWatch: all
    run:
      config: Debug
    analyze:
      config: Debug

