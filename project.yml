# =============================================================================
# ECHOELMUSIC - XCODEGEN PROJECT CONFIGURATION
# =============================================================================
# DAW + Video Production — iOS
# =============================================================================

name: Echoelmusic

options:
  bundleIdPrefix: com.echoelmusic
  deploymentTarget:
    iOS: "17.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Release

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_NAME: $(TARGET_NAME)
    MARKETING_VERSION: "7.1.0"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER:=1}"
    ENABLE_BITCODE: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GCC_OPTIMIZATION_LEVEL: "s"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APP_ICON_ASSETS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
      DEBUG_INFORMATION_FORMAT: "dwarf"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-function-bodies=200 -Xfrontend -warn-long-expression-type-checking=200"
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      SWIFT_COMPILATION_MODE: "wholemodule"

# =============================================================================
# TARGETS
# =============================================================================

targets:

  # ===========================================================================
  # iOS App — Bio-Reactive Soundscape Generator
  # ===========================================================================
  Echoelmusic:
    type: application
    platform: iOS
    sources:
      - path: Sources/Echoelmusic
        type: group
        excludes:
          - "**/*.md"
    resources:
      - path: Sources/Echoelmusic/Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        type: file
    info:
      path: Resources/iOS/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Echoelmusic
        LSRequiresIPhoneOS: true

        # === Privacy Strings (ITMS-90683 compliance) ===
        NSMicrophoneUsageDescription: "Echoelmusic uses your microphone for breath detection to shape bio-reactive soundscapes."
        NSHealthShareUsageDescription: "Echoelmusic reads your heart rate and HRV data to generate soundscapes that respond to your body in real-time."
        NSHealthUpdateUsageDescription: "Echoelmusic may save coherence session summaries to HealthKit."
        NSCameraUsageDescription: "Echoelmusic uses your camera for pulse detection (rPPG) to measure heart rate without a wearable."
        NSFaceIDUsageDescription: "Echoelmusic uses TrueDepth camera for facial expression tracking to modulate soundscapes."
        NSBluetoothAlwaysUsageDescription: "Echoelmusic connects to EEG headbands and wearable sensors for bio-reactive soundscape generation."
        NSBluetoothPeripheralUsageDescription: "Echoelmusic connects to EEG headbands for brainwave-reactive audio."
        NSLocationWhenInUseUsageDescription: "Echoelmusic uses your location to fetch weather data that shapes your soundscape."

        ITSAppUsesNonExemptEncryption: false

        # === Background Modes ===
        UIBackgroundModes:
          - audio
          - bluetooth-central

        # === UI Configuration ===
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_NAME: Echoelmusic
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.app
        INFOPLIST_FILE: Resources/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Echoelmusic.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APP_ICON_ASSETS: YES
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
    dependencies: []
      # AUv3 extension disabled — no provisioning profile registered.
      # Re-enable when com.echoelmusic.app.auv3 is registered in App Store Connect.
      # - target: EchoelmusicAUv3
    entitlements:
      path: Echoelmusic.entitlements

  # ===========================================================================
  # EchoelmusicAUv3 — Audio Effect Plugin Extension
  # ===========================================================================
  EchoelmusicAUv3:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/EchoelmusicAUv3
        type: group
        excludes:
          - "**/*.md"
    info:
      path: Resources/EchoelmusicAUv3/Info.plist
      properties:
        CFBundleDisplayName: EchoelmusicAUv3
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AudioUnitViewController
          AudioComponents:
            - name: "Echoelmusic: Bio-Reactive Soundscape"
              description: "Bio-Reactive Ambient Soundscape Generator"
              manufacturer: Echo
              type: augn
              subtype: echl
              version: 10000
              sandboxSafe: true
              tags:
                - Generator
                - Ambient
    entitlements:
      path: EchoelmusicAUv3.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.app.auv3
        INFOPLIST_FILE: Resources/EchoelmusicAUv3/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        SUPPORTS_MACCATALYST: YES
    dependencies: []

# =============================================================================
# SCHEMES
# =============================================================================

schemes:
  Echoelmusic:
    build:
      targets:
        Echoelmusic: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

