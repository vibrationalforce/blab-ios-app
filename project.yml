# =============================================================================
# ECHOELMUSIC - XCODEGEN PROJECT CONFIGURATION
# =============================================================================
# Echoelmusic — bio-reactive performance instrument (iPhone, iOS 18)
# =============================================================================

name: Echoelmusic

options:
  bundleIdPrefix: com.echoelmusic
  deploymentTarget:
    iOS: "18.0"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  groupSortPosition: top
  defaultConfig: Release

configs:
  Debug: debug
  Release: release

settings:
  base:
    SWIFT_VERSION: "6.0"
    PRODUCT_NAME: $(TARGET_NAME)
    # Fallback only — every TestFlight run seds this to the version in
    # .deploy/release (testflight.yml "DEPLOY_VER"), so bump it when it drifts
    # far behind; a manual/local archive would otherwise ship the stale number.
    MARKETING_VERSION: "10.79.66"
    CURRENT_PROJECT_VERSION: "${BUILD_NUMBER:=1}"
    ENABLE_BITCODE: NO
    ALWAYS_SEARCH_USER_PATHS: NO
    SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited)"
    CLANG_ENABLE_MODULES: YES
    CLANG_ENABLE_OBJC_ARC: YES
    SWIFT_OPTIMIZATION_LEVEL: "-O"
    GCC_OPTIMIZATION_LEVEL: "s"
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APP_ICON_ASSETS: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  configs:
    Debug:
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      GCC_OPTIMIZATION_LEVEL: "0"
      DEBUG_INFORMATION_FORMAT: "dwarf"
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG $(inherited)"
      OTHER_SWIFT_FLAGS: "$(inherited) -Xfrontend -warn-long-function-bodies=200 -Xfrontend -warn-long-expression-type-checking=200"
    Release:
      DEBUG_INFORMATION_FORMAT: "dwarf-with-dsym"
      SWIFT_COMPILATION_MODE: "wholemodule"

# =============================================================================
# TARGETS
# =============================================================================

targets:

  # ===========================================================================
  # iOS App — Echoelmusic (bio-reactive performance instrument)
  # ===========================================================================
  Echoelmusic:
    type: application
    platform: iOS
    sources:
      - path: Sources/Echoelmusic
        type: group
        excludes:
          - "**/*.md"
    resources:
      - path: Sources/Echoelmusic/Resources/Assets.xcassets
      # (Removed 2026-07-07: the GeneralUser GS soundfont bundle entry — the
      # sampled-instrument voice is gone entirely, founder "Real Instruments
      # komplett raus", so the 31 MB .sf2 no longer ships.)
      # Drum + sample WAVs — folder references preserve the Drums/ · Samples/
      # subdirectories BeatPlayer looks them up by (subdirectory:"Drums") and
      # avoid filename collisions between the two libraries.
      - path: Sources/Echoelmusic/Resources/Drums
        type: folder
      - path: Sources/Echoelmusic/Resources/Samples
        type: folder
      - path: Resources/PrivacyInfo.xcprivacy
        type: file
      # Brand font Atkinson Hyperlegible (mirrors echoelmusic.com). The .ttf files
      # are converted from the website's .woff2; registered via UIAppFonts below.
      - path: Resources/Fonts
        type: group
    info:
      path: Resources/iOS/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleInfoDictionaryVersion: "6.0"
        CFBundleName: $(PRODUCT_NAME)
        CFBundlePackageType: APPL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: Echoelmusic
        LSRequiresIPhoneOS: true

        # === Privacy Strings (ITMS-90683 compliance) ===
        # Kept in sync with Resources/iOS/Info.plist — vision-aligned, brand-compliant.
        NSMicrophoneUsageDescription: "Echoel uses the microphone to turn live audio into sound, processed on your device. Audio is not recorded or sent anywhere unless you export it yourself."
        NSHealthShareUsageDescription: "Echoel reads heart rate and HRV to drive sound, image and light in real time. This data stays on your device and is used only for creative control — never for diagnosis."
        NSHealthUpdateUsageDescription: "Echoel reads heart rate and HRV on your device for creative control only; it does not write any data to Apple Health."
        NSCameraUsageDescription: "Echoelmusic measures your pulse from your fingertip on the rear camera lens to drive bio-reactive music. No images are stored or transmitted."
        NSBluetoothAlwaysUsageDescription: "Echoelmusic connects to Bluetooth MIDI controllers and audio devices for professional music creation."
        NSBluetoothPeripheralUsageDescription: "Echoelmusic connects to Bluetooth MIDI controllers for music creation."
        NSLocalNetworkUsageDescription: "Echoelmusic uses local network for DMX lighting control, Art-Net, and connecting to external audio interfaces."
        NSBonjourServices:
          - _http._tcp
          - _rtsp._tcp
          - _artnet._udp
          - _osc._udp
          - _midi._udp
          - _echoelmusic._tcp
          - _echoel-colab._tcp
          - _echoel-colab._udp
        ITSAppUsesNonExemptEncryption: false

        # === App Transport Security (local network devices: MIDI, DMX, Art-Net) ===
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

        # === Background Modes ===
        UIBackgroundModes:
          - audio
          - bluetooth-central
          - bluetooth-peripheral

        # === UI Configuration ===
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Dark
        # Brand font (mirrors echoelmusic.com). Files live in Resources/Fonts,
        # added to the app resources above. Keep in sync with Resources/iOS/Info.plist.
        UIAppFonts:
          - AtkinsonHyperlegible-Regular.ttf
          - AtkinsonHyperlegible-Bold.ttf
          - AtkinsonHyperlegible-Italic.ttf
        UIRequiresFullScreen: false
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIRequiredDeviceCapabilities:
          - arm64
    settings:
      base:
        PRODUCT_NAME: Echoelmusic
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.app
        INFOPLIST_FILE: Resources/iOS/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Echoelmusic.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APP_ICON_ASSETS: YES
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: all
    dependencies:
      # Widget extension — compile-verified green (compile_check run on 7c2af59:
      # EchoelmusicWidgets builds for iOS). Embedded so the app bundles the
      # widget. Compile of the embedded build is checked no-signing via
      # compile_check; signing/provisioning of com.echoelmusic.app.widgets is
      # verified by the next full archive (build_only=false).
      - target: EchoelmusicWidgets
      # watchOS companion — embed BLOCKED (C6b). Even WITH
      # WKCompanionAppBundleIdentifier=com.echoelmusic.app in the watch
      # Info.plist, the archive still exports with ZERO valid distribution
      # methods ("Unknown Distribution Error" / "expected one {}"). Root cause is
      # the generated "Embed Watch Content" phase under XcodeGen+Xcode26, which
      # cannot be inspected/fixed from the Linux sandbox (no local Xcode). Kept
      # dependency-OFF so the app+widget archive uploads cleanly (build 1454
      # path). Companion key retained for when the embed phase is solved.
      # NEXT: open the generated .xcodeproj in Xcode, verify the watch app lands
      # in the "Watch" folder via an Embed-Watch-Content phase (not PlugIns/
      # Frameworks); or try XcodeGen dependency `embed: true`/`copy` overrides.
      # - target: EchoelmusicWatch   # re-enable once the embed phase is correct
      # AUv3 generator plugin — now compile-verified for iOS via compile_check
      # (run 26765481421, after the SDKROOT fix). It is an app-extension, the
      # SAME class as the widget that embeds + ships cleanly (unlike the watchOS
      # app). Embedded so the app hosts its own AU plugin (usable in Logic /
      # GarageBand / AUM). com.echoelmusic.app.auv3 signing/provisioning is
      # created by xcodebuild -allowProvisioningUpdates + the ASC API key on the
      # next full archive (same mechanism that provisioned the widget).
      - target: EchoelmusicAUv3
    entitlements:
      path: Echoelmusic.entitlements

  # ===========================================================================
  # EchoelmusicAUv3 — Audio Effect Plugin Extension
  # ===========================================================================
  EchoelmusicAUv3:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/EchoelmusicAUv3
        type: group
        excludes:
          - "**/*.md"
      # Shared DSP (self-contained: Foundation+Accelerate only) compiled into
      # the extension module so the AU can synthesize without a framework.
      - path: Sources/Echoelmusic/DSP
        type: group
      # Foundation-only App-Group bridge for live vitals from the main app.
      - path: Sources/Echoelmusic/Core/BioFeedbackManager.swift
      # Shared numeric helpers (clamped/mapped/lerp) the DSP uses.
      - path: Sources/Echoelmusic/Core/NumericExtensions.swift
    info:
      path: Resources/EchoelmusicAUv3/Info.plist
      properties:
        CFBundleDisplayName: EchoelmusicAUv3
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.AudioUnit-UI
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).AudioUnitViewController
          AudioComponents:
            - name: "Echoelmusic: Bio-Reactive Synth"
              description: "Bio-reactive performance synthesizer"
              manufacturer: Echo
              type: augn
              subtype: echl
              version: 10000
              sandboxSafe: true
              tags:
                - Generator
                - Ambient
    entitlements:
      path: EchoelmusicAUv3.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.app.auv3
        INFOPLIST_FILE: Resources/EchoelmusicAUv3/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # Explicit SDKROOT/SUPPORTED_PLATFORMS — without these XcodeGen's
        # `platform: iOS` left AUv3 defaulting to macOS-only destinations
        # (compile_check caught it). Same fix as the app/widget targets.
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        # iOS-only v10: the app target has no Catalyst, so neither should the
        # plugin. (Was YES — stale; produced Mac Catalyst destinations.)
        SUPPORTS_MACCATALYST: NO
    dependencies: []

  # ===========================================================================
  # EchoelmusicWidgets — WidgetKit Extension (glanceable live vitals)
  # ===========================================================================
  # SHIPPED (cycle C3 done): the widget IS embedded — the Echoelmusic target
  # lists `- target: EchoelmusicWidgets` above, com.echoelmusic.app.widgets is
  # provisioned by the archive (build 1543+ ships app + widget + AUv3). The
  # isolated EchoelmusicWidgets scheme below remains for CI compile checks.
  # (This block previously still described the pre-C3 "dependency OFF" state —
  # corrected 2026-07-04, build-setup hygiene pass.)
  EchoelmusicWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Sources/EchoelmusicWidgets
        type: group
        excludes:
          - "**/*.md"
      # Foundation-only App-Group bridge for live vitals (shared with the app +
      # AUv3). Compiled into the widget module — no app-framework import.
      - path: Sources/Echoelmusic/Core/BioFeedbackManager.swift
    info:
      path: Resources/EchoelmusicWidgets/Info.plist
      properties:
        CFBundleDisplayName: Echoel Bio
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: EchoelmusicWidgets.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.app.widgets
        INFOPLIST_FILE: Resources/EchoelmusicWidgets/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        # Explicit SDKROOT/SUPPORTED_PLATFORMS — XcodeGen's `platform:` alone
        # does not set these here, so without them the target defaults to macOS
        # (matches the main Echoelmusic target's pattern).
        SDKROOT: iphoneos
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies: []

  # ===========================================================================
  # EchoelmusicWatch — watchOS companion (glance + future on-wrist HR source)
  # ===========================================================================
  # Cycle C5 (scaffold). Dependency OFF the iOS app (not embedded yet) so the
  # app archive cannot build/sign it — signing-safe pattern. Compile-verify in
  # isolation via the EchoelmusicWatch scheme. TO SHIP (C6): confirm
  # com.echoelmusic.app.watchkitapp provisioning, then embed as a dependency of
  # the Echoelmusic target. C7 adds HealthKit on-wrist HR → App Group.
  # HARD CONSTRAINT: Watch HR ~4–5 s latency → display/trend only, NO beat-sync.
  EchoelmusicWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: Sources/EchoelmusicWatch
        type: group
        excludes:
          - "**/*.md"
      # Foundation-only App-Group bridge (shared with app + AUv3 + Widgets).
      - path: Sources/Echoelmusic/Core/BioFeedbackManager.swift
    info:
      path: Resources/EchoelmusicWatch/Info.plist
      properties:
        CFBundleDisplayName: Echoel
        WKApplication: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
    entitlements:
      path: EchoelmusicWatch.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.echoelmusic.app.watchkitapp
        INFOPLIST_FILE: Resources/EchoelmusicWatch/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        WATCHOS_DEPLOYMENT_TARGET: "10.0"
        # Explicit SDKROOT/SUPPORTED_PLATFORMS — without these XcodeGen's
        # `platform: watchOS` still leaves the target defaulting to macOS.
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
    dependencies: []

# =============================================================================
# SCHEMES
# =============================================================================

schemes:
  Echoelmusic:
    build:
      targets:
        Echoelmusic: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # Isolated compile-verification scheme for the AUv3 extension. The target
  # existed without a scheme, so compile_check (which builds by scheme name)
  # could not verify it — only an ad-hoc probe could. This makes AUv3
  # first-class for CI compile verification.
  EchoelmusicAUv3:
    build:
      targets:
        EchoelmusicAUv3: all
    run:
      config: Debug
    analyze:
      config: Debug

  # Isolated compile-verification scheme for the Widget extension (cycle C2).
  # Lets CI `build_only` prove the widget compiles WITHOUT embedding it in the
  # app archive, so the green TestFlight pipeline is never bet on a blind embed.
  EchoelmusicWidgets:
    build:
      targets:
        EchoelmusicWidgets: all
    run:
      config: Debug
    analyze:
      config: Debug

  # Isolated compile-verification scheme for the watchOS companion (cycle C5).
  EchoelmusicWatch:
    build:
      targets:
        EchoelmusicWatch: all
    run:
      config: Debug
    analyze:
      config: Debug

