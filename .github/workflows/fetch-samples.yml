# =============================================================================
# ECHOELMUSIC — FETCH SAMPLES (founder's own sample library → manifest → curate)
# =============================================================================
# The founder shared a Google Drive archive of their own samples to convert into
# Echoel instruments. The code-authoring sandbox cannot reach Drive (network
# policy) — this CI runner can. Two-phase, so we NEVER commit gigabytes blindly:
#
#   PHASE 1 (manifest, default): download + extract the Drive archive, then
#     commit ONLY a small `scratchpads/SAMPLES_MANIFEST.txt` (full file tree +
#     sizes + formats). Claude reads that and designs the categorisation.
#   PHASE 2 (curate): a follow-up run reads scratchpads/SAMPLES_MAP.tsv (authored
#     from the manifest — `src_path <TAB> Resources/Samples/<cat>/<name>.wav`),
#     converts each listed file to 16-bit/44.1k mono/stereo WAV via ffmpeg, and
#     commits ONLY the curated set. "Nur samples verwenden, wirklich Sinn machen."
#
# Trigger: push touching `.deploy/fetch-samples` (first line = Drive FILE ID;
# second line = `phase: manifest` or `phase: curate`).
# =============================================================================

name: "Fetch Samples"

on:
  push:
    paths:
      - '.deploy/fetch-samples'

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Read request
        id: req
        run: |
          FID=$(sed -n '1p' .deploy/fetch-samples | tr -d '[:space:]')
          PHASE=$(sed -n '2p' .deploy/fetch-samples | sed 's/phase:[[:space:]]*//' | tr -d '[:space:]')
          [ -z "$PHASE" ] && PHASE="manifest"
          echo "fid=$FID"     >> "$GITHUB_OUTPUT"
          echo "phase=$PHASE" >> "$GITHUB_OUTPUT"
          echo "Drive file ID: $FID · phase: $PHASE"

      - name: Install tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg unzip p7zip-full

      - name: Download from Google Drive
        id: dl
        run: |
          set -e
          FID="${{ steps.req.outputs.fid }}"
          test -n "$FID"
          mkdir -p /tmp/dl
          OUT=/tmp/dl/archive.bin
          # Google's large-file virus-scan interstitial needs a confirm token.
          # Try the modern usercontent endpoint first (confirm=t works for public
          # files), then fall back to the cookie/confirm-token dance.
          curl -sL -c /tmp/dl/cookie \
            "https://drive.usercontent.google.com/download?id=${FID}&export=download&confirm=t" -o "$OUT" || true
          if head -c 15 "$OUT" | grep -qi "html"; then
            echo "First attempt returned HTML — extracting confirm token…"
            curl -sL -c /tmp/dl/cookie "https://drive.google.com/uc?export=download&id=${FID}" -o /tmp/dl/page.html
            TOKEN=$(grep -o 'confirm=[0-9A-Za-z_-]*' /tmp/dl/page.html | head -1 | cut -d= -f2)
            UUID=$(grep -o 'uuid=[0-9A-Za-z_-]*' /tmp/dl/page.html | head -1 | cut -d= -f2)
            echo "token=$TOKEN uuid=$UUID"
            curl -sL -b /tmp/dl/cookie \
              "https://drive.usercontent.google.com/download?id=${FID}&export=download&confirm=${TOKEN}&uuid=${UUID}" -o "$OUT"
          fi
          SIZE=$(stat -c%s "$OUT" 2>/dev/null || echo 0)
          echo "Downloaded: $SIZE bytes"
          echo "size=$SIZE" >> "$GITHUB_OUTPUT"
          if [ "$SIZE" -lt 10000 ]; then
            echo "::error::Download too small ($SIZE bytes) — the Drive file is probably NOT publicly shared. Set it to 'Anyone with the link' and re-run."
            head -c 400 "$OUT" || true
            exit 1
          fi

      - name: Extract
        run: |
          set -e
          mkdir -p /tmp/ex
          cd /tmp/ex
          F=/tmp/dl/archive.bin
          if file "$F" | grep -qi "zip"; then unzip -q "$F";
          elif file "$F" | grep -qiE "7-zip|rar"; then 7z x -y "$F" >/dev/null;
          elif file "$F" | grep -qi "gzip"; then tar xzf "$F";
          else echo "Not an archive — treating as a single file"; cp "$F" ./; fi
          echo "Extracted tree:"; find /tmp/ex -type f | head -50

      - name: Build manifest (phase 1)
        if: steps.req.outputs.phase == 'manifest'
        run: |
          set -e
          M=scratchpads/SAMPLES_MANIFEST.txt
          {
            echo "# Echoel — founder sample library manifest"
            echo "# Drive file ${{ steps.req.outputs.fid }} · ${{ steps.dl.outputs.size }} bytes · generated by fetch-samples.yml"
            echo "# Columns: <bytes>  <path relative to archive root>"
            echo ""
            echo "## Audio files (wav/aif/aiff/flac/mp3/ogg/caf/m4a):"
            find /tmp/ex -type f \( -iname '*.wav' -o -iname '*.aif' -o -iname '*.aiff' \
              -o -iname '*.flac' -o -iname '*.mp3' -o -iname '*.ogg' -o -iname '*.caf' -o -iname '*.m4a' \) \
              -printf '%s\t%P\n' | sort -k2 | sed "s#/tmp/ex/##"
            echo ""
            echo "## Non-audio files:"
            find /tmp/ex -type f ! \( -iname '*.wav' -o -iname '*.aif' -o -iname '*.aiff' \
              -o -iname '*.flac' -o -iname '*.mp3' -o -iname '*.ogg' -o -iname '*.caf' -o -iname '*.m4a' \) \
              -printf '%s\t%P\n' | sort -k2 | sed "s#/tmp/ex/##"
            echo ""
            echo "## Summary:"
            echo "audio files: $(find /tmp/ex -type f \( -iname '*.wav' -o -iname '*.aif' -o -iname '*.aiff' -o -iname '*.flac' -o -iname '*.mp3' -o -iname '*.ogg' -o -iname '*.caf' -o -iname '*.m4a' \) | wc -l)"
            echo "total files: $(find /tmp/ex -type f | wc -l)"
            echo "top-level dirs: $(cd /tmp/ex && find . -maxdepth 1 -type d | sed 's#^\./##' | grep -v '^\.$' | tr '\n' ' ')"
          } > "$M"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$M"
          git commit -m "chore(samples): manifest of the founder's Drive sample library (phase 1)"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Curate (phase 2)
        if: steps.req.outputs.phase == 'curate'
        run: |
          set -e
          MAP=scratchpads/SAMPLES_MAP.tsv
          test -f "$MAP" || { echo "::error::phase=curate needs scratchpads/SAMPLES_MAP.tsv"; exit 1; }
          COUNT=0
          while IFS=$'\t' read -r SRC DST; do
            case "$SRC" in ''|'#'*) continue;; esac
            IN="/tmp/ex/$SRC"
            if [ ! -f "$IN" ]; then echo "MISS: $SRC"; continue; fi
            mkdir -p "$(dirname "$DST")"
            # Normalise to 16-bit / 44.1k PCM WAV; keep channel count (mono stays mono).
            ffmpeg -y -loglevel error -i "$IN" -acodec pcm_s16le -ar 44100 "$DST"
            COUNT=$((COUNT+1))
          done < "$MAP"
          echo "Converted $COUNT files."
          test "$COUNT" -gt 0 || { echo "::error::0 files converted — check SAMPLES_MAP.tsv src paths against the manifest."; exit 1; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Sources/Echoelmusic/Resources
          git commit -m "chore(samples): curated + converted founder sample set (phase 2, $COUNT files)"
          git push origin "HEAD:${{ github.ref_name }}"

      - name: Summary
        run: |
          echo "## Fetch Samples — phase ${{ steps.req.outputs.phase }}" >> "$GITHUB_STEP_SUMMARY"
          echo "Downloaded ${{ steps.dl.outputs.size }} bytes." >> "$GITHUB_STEP_SUMMARY"
