# =============================================================================
# ECHOELMUSIC - QUICK TEST WORKFLOW
# =============================================================================
# Fast, platform-agnostic checks on the cheap Linux runner ($0.008/min):
# secrets / code-quality only.
#
# NOTE: the Swift build + full test suite intentionally do NOT run here. Echoel
# is an Apple-framework app (AVFoundation, Accelerate, SwiftUI, Observation,
# CoreMIDI, Metal, HealthKit) and cannot compile on Linux. The authoritative
# build + test gate is the macOS "Echoelmusic CI/CD Pipeline" (SwiftPM) plus the
# iOS/AUv3 archive "Compile Check" in testflight.yml. Running `swift build` on
# Linux only ever produces a guaranteed-red, signal-free job, so it is removed.
# =============================================================================

name: "⚡ Quick Test"

on:
  workflow_dispatch:
  push:
    branches: [develop, 'claude/**']  # develop + Claude feature branches
    paths:
      - 'Sources/**/*.swift'
      - 'Tests/**/*.swift'
      - 'Package.swift'

jobs:
  lint:
    name: "🔍 Code Quality"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets in code
        run: |
          # This step used to be `! grep ... || echo "No secrets found"`, which
          # exits 0 in BOTH directions: no match -> `!` flips 1 to 0; a match ->
          # `!` flips 0 to 1 and `|| echo` swallows it. It could never fail, so
          # it reported "no secrets" over a file that contained one.
          echo "Checking for hardcoded secrets..."
          if grep -rnE "AKIA[0-9A-Z]{16}|sk-[A-Za-z0-9]{20,}|gh[pousr]_[A-Za-z0-9]{30,}|password[[:space:]]*=[[:space:]]*[\"']" \
               --include="*.swift" --include="*.kt" --include="*.json" \
               --exclude-dir=.git . ; then
            echo "::error::possible hardcoded secret above"
            exit 1
          fi
          echo "No secrets found"

      - name: "✅ Lint Passed"
        run: echo "Code quality checks passed!"

  summary:
    name: "📊 Test Summary"
    needs: [lint]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Results
        run: |
          echo "================================"
          echo "  QUICK TEST RESULTS"
          echo "================================"
          echo "Lint:    ${{ needs.lint.result }}"
          echo "================================"
          echo ""
          echo "💡 Platform-agnostic quick check only (~\$0.01)."
          echo "   Swift build + tests run on macOS:"
          echo "   'Echoelmusic CI/CD Pipeline' + testflight.yml Compile Check."
