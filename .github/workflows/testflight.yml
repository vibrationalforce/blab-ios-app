# =============================================================================
# ECHOELMUSIC - TESTFLIGHT DEPLOYMENT
# =============================================================================
# Pure API Key Auth + xcodebuild direct (no Fastlane build_app)
# xcodebuild archive + exportArchive with -allowProvisioningUpdates
# Fastlane used ONLY for upload_to_testflight
# =============================================================================

name: "TestFlight"

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform to deploy'
        required: true
        default: 'ios'
        type: choice
        options:
          - ios
          - macos
          - watchos
          - tvos
          - visionos
          - all
      clean_build:
        description: 'Force clean build'
        required: false
        default: false
        type: boolean
      skip_tests:
        description: 'Skip pre-flight tests'
        required: false
        default: true
        type: boolean
      build_only:
        description: 'Build only (no TestFlight upload) - for compile testing'
        required: false
        default: false
        type: boolean
      skip_compile_check:
        description: 'Skip simulator compile check'
        required: false
        default: true
        type: boolean
  # Tokenless deploy: bumping `.deploy/release` on any branch triggers an iOS
  # TestFlight upload. App Store Connect credentials live as GitHub repo secrets
  # (CI-side), so no local token is needed — a `git push` is enough. Path-filtered
  # so ordinary code pushes never deploy; only an explicit `.deploy/release` bump.
  push:
    paths:
      - '.deploy/release'

concurrency:
  group: testflight-${{ github.event.inputs.platform }}-${{ github.ref }}
  cancel-in-progress: false

env:
  XCODE_VERSION: '26.2'
  BUILD_NUMBER: ${{ github.run_number }}
  CLEAN_BUILD: ${{ github.event.inputs.clean_build }}

jobs:
  # ===========================================================================
  # PREFLIGHT
  # ===========================================================================
  preflight:
    name: "Preflight"
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      ready: ${{ steps.validate.outputs.ready }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Validate Secrets"
        id: validate
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +e
          ERRORS=0
          echo "=== TESTFLIGHT PREFLIGHT ==="
          echo "Platform: ${{ github.event.inputs.platform }} | Build: ${{ github.run_number }}"

          # Secret validation — emit ::error:: annotations so a missing/expired
          # App Store Connect credential is impossible to miss in the run summary.
          check_secret() {
            local name="$1" val="$2"
            if [ -z "$val" ]; then
              echo "[FAIL] $name is empty or unset"
              echo "::error title=Missing secret::$name is not set. Add it under repo Settings → Secrets and variables → Actions."
              ERRORS=$((ERRORS+1))
            else
              echo "[OK] $name (${#val} chars)"
            fi
          }
          check_secret "APP_STORE_CONNECT_KEY_ID"      "$ASC_KEY_ID"
          check_secret "APP_STORE_CONNECT_ISSUER_ID"   "$ASC_ISSUER_ID"
          check_secret "APP_STORE_CONNECT_PRIVATE_KEY" "$ASC_KEY"
          check_secret "APPLE_TEAM_ID"                 "$TEAM_ID"

          # Private key sanity: must look like a PEM block, not a stray filename/path.
          if [ -n "$ASC_KEY" ] && ! printf '%s' "$ASC_KEY" | grep -q "BEGIN PRIVATE KEY"; then
            echo "::warning title=PRIVATE_KEY format::APP_STORE_CONNECT_PRIVATE_KEY does not contain a 'BEGIN PRIVATE KEY' PEM header — paste the full .p8 contents, not a path."
          fi

          for f in Package.swift project.yml fastlane/Fastfile fastlane/Appfile; do
            [ -f "$f" ] && echo "[OK] $f" || { echo "[FAIL] $f missing"; echo "::error title=Missing file::$f not found"; ERRORS=$((ERRORS+1)); }
          done

          if [ $ERRORS -gt 0 ]; then
            echo "FAILED: $ERRORS error(s)"
            {
              echo "### ❌ Preflight failed — $ERRORS error(s)"
              echo "Set the 4 App Store Connect secrets in repo Settings → Secrets and variables → Actions:"
              echo "- \`APP_STORE_CONNECT_KEY_ID\` · \`APP_STORE_CONNECT_ISSUER_ID\` · \`APP_STORE_CONNECT_PRIVATE_KEY\` · \`APPLE_TEAM_ID\`"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          echo "PASSED"
          echo "### ✅ Preflight passed — all secrets present" >> "$GITHUB_STEP_SUMMARY"
          echo "ready=true" >> $GITHUB_OUTPUT

  # ===========================================================================
  # COMPILE CHECK
  # ===========================================================================
  compile_check:
    name: "Compile Check"
    runs-on: macos-26
    needs: preflight
    if: needs.preflight.outputs.ready == 'true' && github.event.inputs.skip_compile_check != 'true'
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: "Print Xcode Version"
        run: xcodebuild -version

      - name: "Verify iOS 26 SDK (ITMS-90725)"
        run: |
          SDK=$(xcodebuild -showsdks | grep -E "iphoneos[0-9]" | tail -1)
          echo "Available iOS SDK: $SDK"
          SDK_VER=$(echo "$SDK" | grep -oE "iphoneos[0-9]+" | grep -oE "[0-9]+")
          echo "SDK major version: $SDK_VER"
          if [ -z "$SDK_VER" ] || [ "$SDK_VER" -lt 26 ]; then
            echo "::error title=SDK Too Old::iOS SDK version $SDK_VER is below 26. ITMS-90725 will reject this build after April 28 2026. Check Xcode version on runner."
            exit 1
          fi
          echo "iOS $SDK_VER SDK confirmed — ITMS-90725 requirement met."

      - name: "Cache Swift PM"
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-compile-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-compile-

      - name: "Cache DerivedData"
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-derived-compile-${{ hashFiles('project.yml') }}
          restore-keys: ${{ runner.os }}-derived-compile-

      - name: "Setup XcodeGen"
        uses: ./.github/actions/setup-xcodegen
        with:
          version: '2.42.0'

      - name: "Generate Xcode Project"
        run: |
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"PLACEHOLDER1\"/" project.yml
          sed -i '' "s/\${BUILD_NUMBER:=1}/${{ env.BUILD_NUMBER }}/" project.yml
          # Auto-version: the App Store version follows the .deploy/release label so it
          # never goes stale (founder saw every build stuck at 10.65.0). Defensive — if
          # the label can't be parsed, the project.yml default is kept and the build
          # proceeds unchanged, so this can never break the deploy.
          DEPLOY_VER=$(grep -m1 -oE 'v[0-9]+\.[0-9]+\.[0-9]+' .deploy/release | head -1 | tr -dc '0-9.' || true)
          if [ -n "$DEPLOY_VER" ]; then sed -i '' "s/MARKETING_VERSION: \"[0-9.]*\"/MARKETING_VERSION: \"$DEPLOY_VER\"/" project.yml; fi
          xcodegen generate --spec project.yml

      - name: "Compile (iOS device SDK, no signing)"
        run: |
          set +eo pipefail
          xcodebuild build \
            -project Echoelmusic.xcodeproj \
            -scheme Echoelmusic \
            -destination "generic/platform=iOS" \
            -configuration Release \
            -derivedDataPath ./build/DerivedData \
            -skipPackagePluginValidation \
            -parallelizeTargets \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            ONLY_ACTIVE_ARCH=NO \
            SUPPORTED_PLATFORMS=iphoneos \
            2>&1 | tee /tmp/compile.log
          RESULT=${PIPESTATUS[0]}
          set -eo pipefail
          if [ $RESULT -ne 0 ]; then
            echo "=== COMPILE FAILED (exit $RESULT) ==="
            # Write errors as GitHub annotations (visible via check-runs API)
            SWIFT_ERRORS=$(grep -E ': error: ' /tmp/compile.log | head -20 | tr '\n' ' ||| ' || true)
            echo "::error title=Swift Compile Errors::${SWIFT_ERRORS:-NO_SWIFT_ERRORS_FOUND}"
            LAST_LINES=$(tail -30 /tmp/compile.log | tr '\n' ' ||| ' || true)
            echo "::error title=Compile Tail::${LAST_LINES}"
            # Also write to step summary
            echo "## Compile Failed (exit $RESULT)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep -E "error:" /tmp/compile.log | head -40 >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            echo "### Last 50 lines" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 /tmp/compile.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      # Ecosystem extension/companion targets are dependency-OFF the app scheme
      # (signing-safe), so the main compile above never touches them. Compile
      # each of their schemes here (no signing) to give the loop real per-target
      # green/red. Scheme-existence guarded so a future removal can't break CI.
      - name: "Compile ecosystem targets (no signing)"
        run: |
          set +eo pipefail
          FAILED=0
          compile_scheme() {
            local scheme="$1" destination="$2"
            if ! xcodebuild -project Echoelmusic.xcodeproj -list 2>/dev/null | grep -q "$scheme"; then
              echo "::warning title=Scheme Not Found::$scheme not in project — skipping compile"
              echo "## $scheme — skipped (scheme not found)" >> $GITHUB_STEP_SUMMARY
              return
            fi
            echo "=== Compiling $scheme ($destination) ==="
            xcodebuild build \
              -project Echoelmusic.xcodeproj \
              -scheme "$scheme" \
              -destination "$destination" \
              -configuration Release \
              -derivedDataPath ./build/DerivedData \
              -skipPackagePluginValidation \
              -parallelizeTargets \
              CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              2>&1 | tee "/tmp/compile-$scheme.log"
            local rc=${PIPESTATUS[0]}
            if [ $rc -ne 0 ]; then
              # Raw logs live on a blob host the sandbox can't reach; surface the
              # available destinations + the error tail through the ANNOTATION
              # channel (api.github.com) so failures are diagnosable from here.
              DESTS=$(xcodebuild -project Echoelmusic.xcodeproj -scheme "$scheme" -showdestinations 2>&1 | grep -E "platform:" | head -20 | tr '\n' ' ||| ' || true)
              echo "::warning title=$scheme available destinations::${DESTS:-NONE_FOUND}"
              TAIL=$(tail -20 /tmp/compile-$scheme.log | tr '\n' ' ||| ' || true)
              echo "::error title=$scheme Compile Errors::$(grep -E ': error: |error:' /tmp/compile-$scheme.log | head -10 | tr '\n' ' ||| ' || true) === TAIL: $TAIL"
              echo "## $scheme — compile FAILED (exit $rc)" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              grep -E "error:" "/tmp/compile-$scheme.log" | head -30 >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              FAILED=1
            else
              echo "## $scheme — compile OK" >> $GITHUB_STEP_SUMMARY
            fi
          }
          # Device generic destinations (no simulator runtime needed, no
          # signing with CODE_SIGNING_ALLOWED=NO) — same destination class the
          # main Echoelmusic compile proves works on this runner.
          compile_scheme EchoelmusicWidgets "generic/platform=iOS"
          compile_scheme EchoelmusicWatch "generic/platform=watchOS"
          compile_scheme EchoelmusicAUv3 "generic/platform=iOS"
          set -eo pipefail
          [ $FAILED -eq 0 ]

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compile-check-log
          path: /tmp/compile*.log
          retention-days: 3

  # ===========================================================================
  # iOS DEPLOYMENT
  # ===========================================================================
  ios:
    name: "iOS"
    runs-on: macos-26
    needs: [preflight]
    if: |
      always() &&
      needs.preflight.outputs.ready == 'true' &&
      ((github.event.inputs.platform || 'ios') == 'ios' || (github.event.inputs.platform || 'ios') == 'all') &&
      github.event.inputs.build_only != 'true'
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: "Verify iOS 26 SDK (ITMS-90725)"
        run: |
          SDK=$(xcodebuild -showsdks | grep -E "iphoneos[0-9]" | tail -1)
          echo "Available iOS SDK: $SDK"
          SDK_VER=$(echo "$SDK" | grep -oE "iphoneos[0-9]+" | grep -oE "[0-9]+")
          echo "SDK major version: $SDK_VER"
          if [ -z "$SDK_VER" ] || [ "$SDK_VER" -lt 26 ]; then
            echo "::error title=SDK Too Old::iOS SDK version $SDK_VER is below 26. ITMS-90725 will reject this build after April 28 2026. Check Xcode version on runner."
            exit 1
          fi
          echo "iOS $SDK_VER SDK confirmed — ITMS-90725 requirement met."

      - name: "Cache Swift PM"
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-ios-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-ios-

      - name: "Cache DerivedData"
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-derived-ios-${{ hashFiles('project.yml') }}
          restore-keys: ${{ runner.os }}-derived-ios-

      - name: "Setup XcodeGen"
        uses: ./.github/actions/setup-xcodegen
        with:
          version: '2.42.0'

      - name: "Install Fastlane & Generate Project"
        run: |
          # fastlane is needed again to revoke stale dev certs before archive
          # (Apple dev-cert limit management — see Setup Signing Certificates).
          gem install fastlane:2.225.0 -N --no-document
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"${{ secrets.APPLE_TEAM_ID }}\"/" project.yml
          sed -i '' "s/\${BUILD_NUMBER:=1}/${{ env.BUILD_NUMBER }}/" project.yml
          # Auto-version: the App Store version follows the .deploy/release label so it
          # never goes stale (founder saw every build stuck at 10.65.0). Defensive — if
          # the label can't be parsed, the project.yml default is kept and the build
          # proceeds unchanged, so this can never break the deploy.
          DEPLOY_VER=$(grep -m1 -oE 'v[0-9]+\.[0-9]+\.[0-9]+' .deploy/release | head -1 | tr -dc '0-9.' || true)
          if [ -n "$DEPLOY_VER" ]; then sed -i '' "s/MARKETING_VERSION: \"[0-9.]*\"/MARKETING_VERSION: \"$DEPLOY_VER\"/" project.yml; fi
          xcodegen generate --spec project.yml

      - name: "Setup API Key & Keychain"
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          # Write API key to disk
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          # Create fresh empty keychain (avoids stale cert conflicts).
          # xcodebuild populates it with the distribution cert it creates via
          # -allowProvisioningUpdates + the API key passed to the Archive step.
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "Fresh keychain ready"

      - name: "Setup Signing Certificates"
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Revoke stale dev certs so -allowProvisioningUpdates can create fresh
          # per-target (app/widgets/auv3) dev profiles under Apple's dev-cert
          # limit. Removing this earlier caused certs to accumulate across runs →
          # archive failed finding extension dev profiles. Safe here: single iOS
          # job per dispatch (no parallel job to race the revocation).
          set +eo pipefail
          fastlane ios setup_signing 2>&1 | tee /tmp/signing.log
          RESULT=${PIPESTATUS[0]}
          set -eo pipefail
          if [ $RESULT -ne 0 ]; then
            echo "::warning title=Signing setup non-zero::falling back to xcodebuild automatic signing"
          fi

      - name: "Archive"
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          xcodebuild -version
          echo "=== Starting Archive ==="

          set +eo pipefail
          xcodebuild archive \
            -project Echoelmusic.xcodeproj \
            -scheme Echoelmusic \
            -destination "generic/platform=iOS" \
            -archivePath ./build/Echoelmusic.xcarchive \
            -configuration Release \
            -derivedDataPath ./build/DerivedData \
            -allowProvisioningUpdates \
            -parallelizeTargets \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyPath "$API_KEY_PATH" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            COMPILER_INDEX_STORE_ENABLE=NO \
            SUPPORTED_PLATFORMS=iphoneos \
            2>&1 | tee /tmp/archive.log
          RESULT=${PIPESTATUS[0]}
          set -eo pipefail

          if [ $RESULT -ne 0 ]; then
            echo "=== ARCHIVE FAILED (exit $RESULT) ==="
            # Extract Swift compile errors specifically (|| true to avoid pipefail exit)
            SWIFT_ERRORS=$(grep -E ': error: ' /tmp/archive.log | head -20 | tr '\n' ' ||| ' || true)
            echo "::error title=Swift Errors::${SWIFT_ERRORS:-NO_SWIFT_ERRORS_FOUND}"
            # Write errors as GitHub annotations (visible via API)
            LAST_LINES=$(tail -30 /tmp/archive.log | tr '\n' ' | ')
            echo "::error title=Archive Failed::${LAST_LINES}"
            ERRORS=$(grep -iE "error:|failed|signing|provision|certificate|not found" /tmp/archive.log | tail -10 | tr '\n' ' | ' || true)
            echo "::error title=Build Errors::${ERRORS:-NO_ERRORS_MATCHED}"
            # Also write full tail to step summary
            echo "## Archive Failed (exit $RESULT)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            { grep -E ': error: |: warning: .*(deprecated|unavailable)' /tmp/archive.log | head -30 || true; } >> $GITHUB_STEP_SUMMARY
            echo '---' >> $GITHUB_STEP_SUMMARY
            tail -50 /tmp/archive.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "=== ARCHIVE SUCCESSFUL ==="

      # AUv3-EMBED-BEWEIS (device log 2026-07-16 "ownAUv3 false"): the extension
      # was embedded but its AudioComponents sat outside NSExtensionAttributes,
      # so pluginkit never registered it — invisible to every host. This step
      # makes the whole chain CI-provable forever: appex present, executable
      # present, AudioComponents at the REGISTRATION-EFFECTIVE path, identity
      # augn/echl/Echo unchanged. Fails the build on any silent drift.
      - name: "Verify AUv3 extension embed + registration structure"
        run: |
          APP="./build/Echoelmusic.xcarchive/Products/Applications/Echoelmusic.app"
          APPEX="$APP/PlugIns/EchoelmusicAUv3.appex"
          PLIST="$APPEX/Info.plist"
          fail() { echo "::error title=AUv3 embed check::$1"; exit 1; }
          [ -d "$APP" ]   || fail "App bundle missing at $APP"
          [ -d "$APPEX" ] || fail "EchoelmusicAUv3.appex NOT embedded in the app (PlugIns/ missing it)"
          [ -f "$PLIST" ] || fail "appex Info.plist missing"
          EXEC=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$PLIST" 2>/dev/null || true)
          [ -n "$EXEC" ] && [ -f "$APPEX/$EXEC" ] || fail "appex executable missing ($EXEC)"
          P='NSExtension:NSExtensionAttributes:AudioComponents:0'
          TYPE=$(/usr/libexec/PlistBuddy -c "Print :$P:type" "$PLIST" 2>/dev/null || true)
          SUB=$(/usr/libexec/PlistBuddy -c "Print :$P:subtype" "$PLIST" 2>/dev/null || true)
          MFR=$(/usr/libexec/PlistBuddy -c "Print :$P:manufacturer" "$PLIST" 2>/dev/null || true)
          [ "$TYPE" = "augn" ] && [ "$SUB" = "echl" ] && [ "$MFR" = "Echo" ] \
            || fail "AudioComponents not at NSExtensionAttributes path or identity drifted (type='$TYPE' subtype='$SUB' mfr='$MFR' — expected augn/echl/Echo)"
          PRINCIPAL=$(/usr/libexec/PlistBuddy -c 'Print :NSExtension:NSExtensionPrincipalClass' "$PLIST" 2>/dev/null || true)
          [ -n "$PRINCIPAL" ] || fail "NSExtensionPrincipalClass missing"
          echo "AUv3 embed OK: $APPEX ($EXEC), component $TYPE/$SUB/$MFR, principal $PRINCIPAL"

      # AUv3-HOST-ENTITLEMENT-SICHTBARKEIT (device 2026-07-19; re-corrected 2026-07-20).
      # v300 (fail-on-stripped) PROVED inter-app-audio is STRIPPED from the signed app:
      # automatic signing can only provision a capability the App ID already has enabled
      # in the portal, and com.echoelmusic.app does NOT have "Inter-App Audio" enabled,
      # so the declared entitlement is dropped at signing.
      # DEEP-RESEARCH CORRECTION (2026-07-20, Apple DevForums 127481 + 89762, EXACT
      # symptom "AVAudioUnitComponentManager returns only Apple AUs, zero third-party"):
      # since iOS 11 the inter-app-audio ENTITLEMENT gates a process's ability to SCAN
      # third-party audio components at all — with it absent, discovery returns Apple
      # built-ins only (precisely Echoel's symptom). The IAA *protocol* is deprecated,
      # but the *entitlement* still gates scanning. (The earlier "probably doesn't gate
      # discovery" note was wrong; it conflated the deprecated protocol with the still-
      # active scan gate, and used the SEPARATE own-appex -3000 pluginkit issue to
      # dismiss it.) THE FIX is a portal action: enable "Inter-App Audio" on the
      # com.echoelmusic.app App ID; then this entitlement survives signing and the
      # process can enumerate third-party AUv3. Residual unknown: whether Apple still
      # offers/honors the capability on iOS 18 — this report is how we verify it took.
      # Still NON-BLOCKING (a permanently-red gate would block every deploy).
      - name: "Report Inter-App-Audio entitlement in the SIGNED app (non-blocking)"
        run: |
          APP="./build/Echoelmusic.xcarchive/Products/Applications/Echoelmusic.app"
          ENT=$(codesign -d --entitlements :- "$APP" 2>/dev/null || true)
          echo "=== signed host entitlements (filtered) ==="
          echo "$ENT" | grep -iE "inter-app|application-identifier|application-groups|aps-environment|healthkit" || echo "(none matched)"
          if echo "$ENT" | grep -qi "inter-app-audio"; then
            echo "AUV3 inter-app-audio: PRESENT in signed binary"
            echo "✅ AUv3 host entitlement inter-app-audio PRESENT in signed app — third-party AU scanning is unblocked (verify on device)" >> $GITHUB_STEP_SUMMARY
          elif [ -z "$(echo "$ENT" | tr -d '[:space:]')" ]; then
            echo "::warning title=AUv3 entitlement check inconclusive::codesign returned no entitlements."
            echo "⚠️ AUv3 entitlement check inconclusive (codesign empty)" >> $GITHUB_STEP_SUMMARY
          else
            echo "::warning title=AUv3 inter-app-audio STRIPPED — likely the third-party-discovery gate::Enable 'Inter-App Audio' on the com.echoelmusic.app App ID in the developer portal, then re-archive (Apple DevForums 127481/89762)."
            echo "❌ AUv3 inter-app-audio STRIPPED from the signed app — this is the documented gate for third-party AU discovery (DevForums 127481/89762). FIX: enable 'Inter-App Audio' on the com.echoelmusic.app App ID in the portal, then re-archive; automatic signing will keep it." >> $GITHUB_STEP_SUMMARY
          fi

      # AUv3-APPEX-SIGN-DIAGNOSE (device try 1/3 2026-07-20: self-probe still FAILED
      # -3000 AFTER the App-Group removal shipped (v306+) AND after reinstall —
      # both prior theories disproven). The extension is REGISTERED (AUM lists it)
      # but its PROCESS launch is denied everywhere, which is a code-signing /
      # provisioning fact of the APPEX, not the host app. The existing step above
      # only dumps the APP's entitlements; this one dumps the APPEX's OWN signed
      # entitlements + its embedded provisioning profile — the exact data that
      # decides whether iOS will launch the extension. NON-BLOCKING, read-only,
      # never fails the build (mirrors the step above): it only records the truth in
      # the job summary so the next build discriminates the remaining causes
      # (entitlement the appex App ID isn't granted · App-ID/Team mismatch · a
      # wildcard-only profile · get-task-allow drift) without guesswork.
      - name: "Report AUv3 APPEX signed entitlements + provisioning (non-blocking)"
        run: |
          APP="./build/Echoelmusic.xcarchive/Products/Applications/Echoelmusic.app"
          APPEX="$APP/PlugIns/EchoelmusicAUv3.appex"
          echo "## AUv3 appex signing diagnostic" >> $GITHUB_STEP_SUMMARY
          if [ ! -d "$APPEX" ]; then
            echo "⚠️ appex not found at $APPEX (embed step should have caught this)" >> $GITHUB_STEP_SUMMARY
            exit 0
          fi
          echo "=== appex signed entitlements ==="
          AENT=$(codesign -d --entitlements :- "$APPEX" 2>/dev/null || true)
          echo "$AENT" | grep -iE "application-identifier|application-groups|team-identifier|get-task-allow|aps-environment|inter-app|beta-reports|com.apple" || echo "(no entitlements — appex signed with none)"
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$AENT" | grep -iE "application-identifier|application-groups|team-identifier|get-task-allow" >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(appex entitlements: none matched)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          # Embedded provisioning profile — the grant side. A profile whose
          # entitlements/App-ID don't cover what the appex requests => launch denial.
          # Decode a .mobileprovision to a temp plist, then read fields (PlistBuddy
          # on /dev/stdin is flaky — a real file is robust). Echoes empty on absence.
          readprof() { # $1 = .mobileprovision path, $2 = label
            local prof="$1" label="$2" tmp
            [ -f "$prof" ] || { echo "⚠️ $label has NO embedded.mobileprovision (App Store archives may strip it)" >> $GITHUB_STEP_SUMMARY; return; }
            tmp=$(mktemp)
            security cms -D -i "$prof" -o "$tmp" 2>/dev/null || true
            local name appid team
            name=$(/usr/libexec/PlistBuddy -c 'Print :Name' "$tmp" 2>/dev/null || true)
            appid=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$tmp" 2>/dev/null || true)
            team=$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$tmp" 2>/dev/null || true)
            echo "$label profile: name='$name' application-identifier='$appid' team='$team'"
            echo "- $label profile application-identifier: \`$appid\` (name: $name, team: $team)" >> $GITHUB_STEP_SUMMARY
            rm -f "$tmp"
          }
          readprof "$APPEX/embedded.mobileprovision" "appex"
          readprof "$APP/embedded.mobileprovision" "app"
          echo "(appex application-identifier should be TEAM.com.echoelmusic.app.auv3, sharing the app's team prefix — a mismatch or wildcard explains the launch denial)" >> $GITHUB_STEP_SUMMARY
          echo "(non-blocking diagnostic — never fails the build)"

      - name: "Export & Upload to TestFlight"
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # destination:upload — xcodebuild uploads directly to App Store Connect,
          # no IPA written to disk, no separate Fastlane upload step needed.
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          PLIST

          echo "=== Exporting & Uploading directly to TestFlight ==="
          # App Store Connect is intermittently flaky on the export/upload step in
          # two ways, BOTH transient (the archive itself is valid):
          #   1. Provisioning mint glitch: "No profiles for '...' were found" /
          #      "data couldn't be read because it isn't in the correct format".
          #   2. ASC service/auth outage: HTTP 503 "Service Temporarily Unavailable",
          #      "Unable to authenticate with App Store Connect", "No Accounts with
          #      App Store Connect Access", "returned unexpected content", timeouts.
          # Both self-heal on retry, so retry those SPECIFIC patterns with backoff.
          # Genuine errors (compile, real auth/config) don't match and fail fast.
          TRANSIENT='No profiles for|couldn.t be read because it isn.t in the correct format|Service Temporarily Unavailable|503|No Accounts with App Store Connect Access|Unable to authenticate with App Store Connect|returned unexpected content|The request timed out|timed out|connection was lost|Could not connect to the server'
          RESULT=1
          for attempt in 1 2 3 4 5; do
            echo "--- export/upload attempt $attempt/5 ---"
            set +eo pipefail
            xcodebuild -exportArchive \
              -archivePath ./build/Echoelmusic.xcarchive \
              -exportPath ./build \
              -exportOptionsPlist /tmp/ExportOptions.plist \
              -allowProvisioningUpdates \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyPath "$API_KEY_PATH" \
              2>&1 | tee /tmp/export.log
            RESULT=${PIPESTATUS[0]}
            set -eo pipefail
            [ $RESULT -eq 0 ] && break
            if grep -qE "$TRANSIENT" /tmp/export.log; then
              echo "::warning title=Transient export retry::ASC transient error on attempt $attempt — retrying in 30s"
              sleep 30
            else
              echo "Non-transient export failure — not retrying."
              break
            fi
          done

          if [ $RESULT -ne 0 ]; then
            echo "=== EXPORT/UPLOAD FAILED (exit $RESULT) ==="
            SWIFT_ERRORS=$(grep -E ': error: ' /tmp/export.log | head -20 | tr '\n' ' ||| ' || true)
            echo "::error title=Export/Upload Errors::${SWIFT_ERRORS:-NO_SWIFT_ERRORS_FOUND}"
            LAST_LINES=$(tail -30 /tmp/export.log | tr '\n' ' ||| ' || true)
            echo "::error title=Export Tail::${LAST_LINES}"
            echo "## Export/Upload Failed (exit $RESULT)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -80 /tmp/export.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            # Signing diagnostics — surface why "No profiles found" / signing failed.
            # These run only on the failure path; a successful export never reaches here.
            # Emit to stdout (readable via the Actions logs API) AND the step summary.
            {
              echo "### Signing diagnostics"
              echo "--- distribution/signing identities in keychain ---"
              security find-identity -v -p codesigning 2>&1 | head -30 || true
              echo "--- installed provisioning profiles ---"
              ls -la "$HOME/Library/MobileDevice/Provisioning Profiles" 2>&1 | head -30 || true
              echo "--- fastlane setup_signing log (tail) ---"
              tail -60 /tmp/signing.log 2>/dev/null || echo "(no /tmp/signing.log)"
              echo "--- archive.log provisioning/signing lines ---"
              grep -iE "provision|signing|certificate|com\.echoelmusic|profile|No profiles" /tmp/archive.log | tail -40 || true
            } 2>&1 | tee -a $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "=== EXPORT & UPLOAD SUCCESSFUL ==="

      - name: "Verify build landed in App Store Connect"
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          EXPECTED_BUILD: ${{ github.run_number }}
          APP_ID: "6757957358"
        run: |
          set -eo pipefail
          if [ -z "$ASC_KEY_CONTENT" ]; then
            echo "::error title=ASC Verify::APP_STORE_CONNECT_PRIVATE_KEY secret is empty"
            exit 1
          fi
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ]; then
            echo "::error title=ASC Verify::ASC key id or issuer id missing"
            exit 1
          fi

          echo "=== Python diagnostics ==="
          which python3 || true
          python3 --version || true
          python3 -m pip --version || true

          echo "=== Installing pyjwt[crypto] ==="
          PIP_LOG=/tmp/pip.log
          set +e
          python3 -m pip install --user --break-system-packages 'pyjwt[crypto]>=2.8' 2>&1 | tee "$PIP_LOG"
          PIP_RESULT=${PIPESTATUS[0]}
          set -e
          if [ "$PIP_RESULT" -ne 0 ]; then
            echo "::error title=pip install failed::pyjwt install returned $PIP_RESULT"
            {
              echo "## ASC Verify — pip install failed"
              echo '```'
              tail -60 "$PIP_LOG"
              echo '```'
            } >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          # JWT signed in-process from the secret directly — no filesystem
          # dependency on prior steps that may have cleaned up the key file.
          cat > /tmp/asc_jwt.py <<'PY'
          import jwt, time, os, sys
          tok = jwt.encode(
              {"iss": os.environ['ASC_ISSUER_ID'],
               "exp": int(time.time()) + 1200,
               "aud": "appstoreconnect-v1"},
              os.environ['ASC_KEY_CONTENT'],
              algorithm="ES256",
              headers={"kid": os.environ['ASC_KEY_ID']},
          )
          sys.stdout.write(tok)
          PY
          JWT=$(python3 /tmp/asc_jwt.py)

          echo "=== Polling ASC for build_number=$EXPECTED_BUILD on app $APP_ID ==="
          for i in $(seq 1 20); do
            RESP=$(curl -sS -H "Authorization: Bearer $JWT" \
              "https://api.appstoreconnect.apple.com/v1/builds?filter%5Bapp%5D=${APP_ID}&filter%5Bversion%5D=${EXPECTED_BUILD}&limit=1")
            COUNT=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d.get('data',[])))" 2>/dev/null || echo 0)
            if [ "$COUNT" -gt 0 ]; then
              BUILD_ID=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['data'][0]['id'])")
              STATE=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['data'][0]['attributes'].get('processingState','UNKNOWN'))")
              UPLOADED=$(echo "$RESP" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['data'][0]['attributes'].get('uploadedDate','?'))")
              echo "::notice title=ASC Build Verified::build_number=$EXPECTED_BUILD id=$BUILD_ID state=$STATE uploaded=$UPLOADED"
              {
                echo "## TestFlight Build Verified in App Store Connect"
                echo "- build_number: \`$EXPECTED_BUILD\`"
                echo "- ASC build ID: \`$BUILD_ID\`"
                echo "- processing state: \`$STATE\`"
                echo "- uploaded: \`$UPLOADED\`"
              } >> $GITHUB_STEP_SUMMARY
              exit 0
            fi
            echo "[attempt $i/20] build_number=$EXPECTED_BUILD not visible yet, sleeping 60s..."
            sleep 60
          done

          # The Export & Upload step already succeeded (the build was uploaded and
          # assigned this number). Apple's TestFlight ingest time is variable and
          # can exceed 20 min — that is NOT a build failure, so this is a WARNING,
          # not an error. The build should appear in TestFlight shortly.
          echo "::warning title=ASC Verify::build_number=$EXPECTED_BUILD not visible via ASC API within 20 min — upload succeeded; Apple processing is slow, check TestFlight shortly"
          {
            echo "## TestFlight Verify — slow ingest (non-fatal)"
            echo "Build number \`$EXPECTED_BUILD\` was **uploaded** but had not appeared via the ASC API after 20 minutes."
            echo "This is almost always Apple-side processing delay, not a build problem. Confirm in TestFlight; if it never appears, check the Export & Upload log and ASC secrets."
          } >> $GITHUB_STEP_SUMMARY
          exit 0

      - name: "Error Summary"
        if: failure()
        run: |
          echo "## iOS Deploy Failed" >> $GITHUB_STEP_SUMMARY
          for logfile in /tmp/archive.log /tmp/export.log; do
            if [ -f "$logfile" ]; then
              echo "### $(basename $logfile)" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              tail -100 "$logfile" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: "Upload Build Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-logs
          path: |
            /tmp/archive.log
            /tmp/export.log
            build/logs/**
          retention-days: 7
          if-no-files-found: warn

      - name: "Cleanup"
        if: always()
        run: |
          rm -rf ~/.appstoreconnect/private_keys 2>/dev/null || true
          security delete-keychain "$HOME/Library/Keychains/build.keychain-db" 2>/dev/null || true

  # ===========================================================================
  # macOS DEPLOYMENT
  # ===========================================================================
  macos:
    name: "macOS"
    runs-on: macos-26
    needs: [preflight]
    if: |
      always() &&
      needs.preflight.outputs.ready == 'true' &&
      (github.event.inputs.platform == 'macos' || github.event.inputs.platform == 'all') &&
      github.event.inputs.build_only != 'true'
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: "Cache Swift PM"
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-macos-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-macos-

      - name: "Cache DerivedData"
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-derived-macos-${{ hashFiles('project.yml') }}
          restore-keys: ${{ runner.os }}-derived-macos-

      - name: "Setup XcodeGen"
        uses: ./.github/actions/setup-xcodegen
        with:
          version: '2.42.0'

      - name: "Install Fastlane & Generate Project"
        run: |
          gem install fastlane:2.225.0 -N --no-document
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"${{ secrets.APPLE_TEAM_ID }}\"/" project.yml
          sed -i '' "s/\${BUILD_NUMBER:=1}/${{ env.BUILD_NUMBER }}/" project.yml
          # Auto-version: the App Store version follows the .deploy/release label so it
          # never goes stale (founder saw every build stuck at 10.65.0). Defensive — if
          # the label can't be parsed, the project.yml default is kept and the build
          # proceeds unchanged, so this can never break the deploy.
          DEPLOY_VER=$(grep -m1 -oE 'v[0-9]+\.[0-9]+\.[0-9]+' .deploy/release | head -1 | tr -dc '0-9.' || true)
          if [ -n "$DEPLOY_VER" ]; then sed -i '' "s/MARKETING_VERSION: \"[0-9.]*\"/MARKETING_VERSION: \"$DEPLOY_VER\"/" project.yml; fi
          xcodegen generate --spec project.yml

      - name: "Check Scheme Exists"
        id: check_scheme
        run: |
          SCHEME="Echoelmusic-macOS"
          if xcodebuild -project Echoelmusic.xcodeproj -list 2>/dev/null | grep -q "$SCHEME"; then
            echo "scheme_exists=true" >> $GITHUB_OUTPUT
            echo "Scheme '$SCHEME' found"
          else
            echo "scheme_exists=false" >> $GITHUB_OUTPUT
            echo "::warning title=Scheme Not Found::Scheme '$SCHEME' does not exist in project. Skipping macOS build."
            echo "## macOS Build Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Scheme '$SCHEME' not found in project.yml. Add it when ready for macOS deployment." >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Setup API Key & Keychain"
        if: steps.check_scheme.outputs.scheme_exists == 'true'
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_KEY_CONTENT" > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          chmod 600 ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

          # Create fresh empty keychain (avoids stale cert conflicts)
          KEYCHAIN_PATH="$HOME/Library/Keychains/build.keychain-db"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KEYCHAIN_PATH"
          echo "Fresh keychain ready"

      - name: "Setup Signing Certificates"
        if: steps.check_scheme.outputs.scheme_exists == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set +eo pipefail
          fastlane mac setup_signing 2>&1 | tee /tmp/signing.log
          RESULT=${PIPESTATUS[0]}
          set -eo pipefail
          if [ $RESULT -ne 0 ]; then
            ERRORS=$(tail -30 /tmp/signing.log | tr '\n' ' | ')
            echo "::error title=Signing Setup Failed::${ERRORS}"
            exit 1
          fi

      - name: "Archive"
        if: steps.check_scheme.outputs.scheme_exists == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          set +eo pipefail
          xcodebuild archive \
            -project Echoelmusic.xcodeproj \
            -scheme Echoelmusic-macOS \
            -destination "generic/platform=macOS" \
            -archivePath ./build/Echoelmusic-macOS.xcarchive \
            -configuration Release \
            -derivedDataPath ./build/DerivedData \
            -allowProvisioningUpdates \
            -parallelizeTargets \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyPath "$API_KEY_PATH" \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CODE_SIGN_STYLE=Automatic \
            COMPILER_INDEX_STORE_ENABLE=NO \
            2>&1 | tee /tmp/archive.log
          RESULT=${PIPESTATUS[0]}
          set -eo pipefail
          if [ $RESULT -ne 0 ]; then
            echo "=== ARCHIVE FAILED (exit $RESULT) ==="
            LAST_LINES=$(tail -30 /tmp/archive.log | tr '\n' ' | ')
            echo "::error title=macOS Archive Failed::${LAST_LINES}"
            ERRORS=$(grep -iE "error:|failed|signing|provision|certificate|not found" /tmp/archive.log | tail -10 | tr '\n' ' | ')
            echo "::error title=macOS Build Errors::${ERRORS}"
            echo "## macOS Archive Failed (exit $RESULT)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -50 /tmp/archive.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
          echo "=== ARCHIVE SUCCESSFUL ==="

      - name: "Export"
        if: steps.check_scheme.outputs.scheme_exists == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          API_KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          cat > /tmp/ExportOptions.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key><string>app-store-connect</string>
              <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
              <key>signingStyle</key><string>automatic</string>
              <key>uploadSymbols</key><true/>
              <key>destination</key><string>export</string>
          </dict>
          </plist>
          PLIST
          set +eo pipefail
          xcodebuild -exportArchive \
            -archivePath ./build/Echoelmusic-macOS.xcarchive \
            -exportPath ./build \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -allowProvisioningUpdates \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyPath "$API_KEY_PATH" \
            2>&1 | tee /tmp/export.log
          RESULT=${PIPESTATUS[0]}
          set -eo pipefail
          [ $RESULT -ne 0 ] && { echo "=== EXPORT FAILED ==="; tail -50 /tmp/export.log; exit 1; }

      - name: "Upload to TestFlight"
        if: steps.check_scheme.outputs.scheme_exists == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: fastlane mac upload

      - name: "Error Summary"
        if: failure() && steps.check_scheme.outputs.scheme_exists == 'true'
        run: |
          echo "## macOS Deploy Failed" >> $GITHUB_STEP_SUMMARY
          for f in /tmp/archive.log /tmp/export.log; do
            [ -f "$f" ] && { echo "### $(basename $f)" >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; tail -100 "$f" >> $GITHUB_STEP_SUMMARY; echo '```' >> $GITHUB_STEP_SUMMARY; }
          done

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-logs
          path: |
            /tmp/archive.log
            /tmp/export.log
            build/logs/**
          retention-days: 7
          if-no-files-found: warn

      - name: "Cleanup"
        if: always()
        run: |
          rm -rf ~/.appstoreconnect/private_keys 2>/dev/null || true
          security delete-keychain "$HOME/Library/Keychains/build.keychain-db" 2>/dev/null || true

  # ===========================================================================
  # watchOS DEPLOYMENT
  # ===========================================================================
  watchos:
    name: "watchOS"
    runs-on: macos-26
    needs: [preflight]
    if: |
      always() &&
      needs.preflight.outputs.ready == 'true' &&
      (github.event.inputs.platform == 'watchos' || github.event.inputs.platform == 'all') &&
      github.event.inputs.build_only != 'true'
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: "Cache Swift PM"
        uses: actions/cache@v4
        with:
          path: |
            ~/.swiftpm
            .build
          key: ${{ runner.os }}-spm-watchos-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: ${{ runner.os }}-spm-watchos-

      - name: "Cache DerivedData"
        uses: actions/cache@v4
        with:
          path: build/DerivedData
          key: ${{ runner.os }}-derived-watchos-${{ hashFiles('project.yml') }}
          restore-keys: ${{ runner.os }}-derived-watchos-

      - name: "Setup XcodeGen"
        uses: ./.github/actions/setup-xcodegen
        with:
          version: '2.42.0'

      - name: "Install Fastlane & Generate Project"
        run: |
          gem install fastlane:2.225.0 -N --no-document
          sed -i '' "s/DEVELOPMENT_TEAM: \"\"/DEVELOPMENT_TEAM: \"${{ secrets.APPLE_TEAM_ID }}\"/" project.yml
          sed -i '' "s/\${BUILD_NUMBER:=1}/${{ env.BUILD_NUMBER }}/" project.yml
          # Auto-version: the App Store version follows the .deploy/release label so it
          # never goes stale (founder saw every build stuck at 10.65.0). Defensive — if
