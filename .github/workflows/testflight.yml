            echo "::warning title=Scheme Not Found::Scheme '$SCHEME' does not exist in project. Skipping watchOS build."
            echo "## watchOS Build Skipped" >> $GITHUB_STEP_SUMMARY
            echo "Scheme '$SCHEME' not found in project.yml. Add it when ready for watchOS deployment." >> $GITHUB_STEP_SUMMARY
          fi

      - name: "Setup API Key & Keychain"
        if: steps.check_scheme.outputs.scheme_exists == 'true'
        env:
          ASC_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
